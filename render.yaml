# Render Blueprint (https://render.com/docs/blueprint-spec).
# Mancala: one web service for the static build + multiplayer WebSocket on the same port.
# Sukkah World: a static site.
services:
  - type: web
    name: mancala
    runtime: node
    plan: free
    # Build from the monorepo root so npm workspaces resolve.
    buildCommand: npm ci --include=dev && npm run build -w mancala
    startCommand: npm run start -w mancala
    healthCheckPath: /
    # Only redeploy when the game (or root dependency files) change.
    buildFilter:
      paths:
        - apps/mancala/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # The server runs TypeScript directly via Node's built-in type stripping (Node >= 23.6).
      - key: NODE_VERSION
        value: "24"

  # Sukkah World: a static PWA (no server yet), so it runs as a free static site on Render's CDN.
  - type: web
    name: sukkah-world
    runtime: static
    branch: sukkah-world
    buildCommand: npm ci --include=dev && npm run build -w sukkah-world
    staticPublishPath: apps/sukkah-world/dist
    headers:
      # The service worker and the page must never be cached, or installed apps get stuck on an old version.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    buildFilter:
      paths:
        - apps/sukkah-world/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
