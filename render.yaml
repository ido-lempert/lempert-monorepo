# Render Blueprint (https://render.com/docs/blueprint-spec).
# Mancala: one web service for the static build + multiplayer WebSocket on the same port.
# Sukkah World and Smash It: static sites (PWAs with no server).
# All deploy from the Blueprint's branch (main); each only rebuilds when its own files change.
services:
  - type: web
    name: mancala
    runtime: node
    plan: free
    # Build from the monorepo root so npm workspaces resolve.
    buildCommand: npm ci --include=dev && npm run build -w mancala
    startCommand: npm run start -w mancala
    healthCheckPath: /
    # Only redeploy when the game (or root dependency files) change.
    buildFilter:
      paths:
        - apps/mancala/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      # The server runs TypeScript directly via Node's built-in type stripping (Node >= 23.6).
      - key: NODE_VERSION
        value: "24"
      # Wall of fame database (Turso). Secrets: set their values in the Render dashboard.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

  # Sukkah World: a static PWA (no server yet), so it runs as a free static site on Render's CDN.
  - type: web
    name: sukkah-world
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w sukkah-world
    staticPublishPath: apps/sukkah-world/dist
    headers:
      # The service worker and the page must never be cached, or installed apps get stuck on an old version.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    buildFilter:
      paths:
        - apps/sukkah-world/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"

  # Smash It: a static PWA (a slingshot game, single-player), a free static site like Sukkah World.
  - type: web
    name: smash-it
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w smash-it
    staticPublishPath: apps/smash-it/dist
    headers:
      # The service worker and the page must never be cached, or installed apps get stuck on an old version.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
    buildFilter:
      paths:
        - apps/smash-it/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
