<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffb84d" />
    <meta name="description" content="Smash It! – a 3D slingshot game for kids: fling food at goofy bugs, stack combos and unlock new snacks. Play in the browser, no install." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smash It!" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Smash It! 🍉 Slingshots, snacks and bugs. Let’s gooo!" />
    <meta property="og:description" content="Fling cookies, watermelons and cream pies at bugs, blast combos and beat the kings. In your browser, no install." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smash It" />
    <title>Smash It!</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Critical styles: show the splash immediately and keep the rest hidden until the world is ready. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffb84d;
        color: #2a1d3d;
        font-family: 'Rubik Variable', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      body:not(.ready) > :not(#splash):not(script) {
        visibility: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, #ffe08a 0%, #ffb84d 70%);
        transition: opacity 0.45s ease;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: min(36vmin, 190px);
        height: auto;
        animation: splash-bounce 0.8s ease-in-out infinite alternate;
      }
      #splash .splash-title {
        font-size: clamp(34px, 9vmin, 56px);
        font-weight: 900;
        letter-spacing: 1px;
      }
      @keyframes splash-bounce {
        to {
          transform: translateY(-14px) rotate(-4deg) scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
    <script>
      // Sets the page language and direction (and the loading text) before the game has loaded.
      // Same rules as src/i18n/langs.ts (matchLanguage); keep the two in step.
      (function () {
        var LOADING = { he: 'שנייה, נטען…', 'en-US': 'One sec, loading…', 'en-GB': 'One sec, loading…', fr: 'Une seconde, ça charge…', ru: 'Секунду, загружаемся…', es: 'Un segundo, cargando…', ar: 'ثانية وبنحمّل…' };
        var lang = null;
        try {
          lang = localStorage.getItem('smashIt.lang');
        } catch (e) {}
        if (!LOADING[lang]) {
          lang = 'en-US';
          var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
          for (var i = 0; i < tags.length; i++) {
            var parts = String(tags[i]).toLowerCase().split('-');
            var p = parts[0];
            if (p === 'iw') p = 'he';
            if (p === 'en') {
              lang = parts[1] && ['us', 'ca', 'ph', 'pr'].indexOf(parts[1]) < 0 ? 'en-GB' : 'en-US';
              break;
            }
            if (LOADING[p]) {
              lang = p;
              break;
            }
          }
        }
        var root = document.documentElement;
        root.lang = lang;
        root.dir = lang === 'he' || lang === 'ar' ? 'rtl' : 'ltr';
        document.addEventListener('DOMContentLoaded', function () {
          var el = document.querySelector('#splash [data-i18n="loading"]');
          if (el) el.textContent = LOADING[lang];
        });
      })();
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <img src="icon.svg" alt="" width="190" height="190" />
      <div class="splash-title" dir="ltr">Smash It!</div>
      <div data-i18n="loading" style="font-weight: 700">One sec, loading…</div>
    </div>

    <main id="stage" data-i18n-attr="aria-label:sceneLabel"></main>
    <div class="vignette hidden" id="vignette" aria-hidden="true"></div>
    <div class="popups" id="popups" aria-hidden="true"></div>
    <div class="sr-only" id="live" aria-live="polite"></div>

    <!-- Home -->
    <section class="screen home hidden" id="home" aria-labelledby="home-title">
      <div class="coins-pill"><span aria-hidden="true">⭐</span> <b id="home-coins">0</b><span class="sr-only" data-i18n="coins"></span></div>
      <button class="icon menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu" data-i18n-attr="title:menu;aria-label:menu">☰</button>
      <div class="home-center">
        <h1 class="logo" id="home-title" dir="ltr">Smash<span>It!</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
        <button class="primary big" id="home-play"></button>
        <div class="row">
          <button class="secondary" id="home-chapters"><span aria-hidden="true">🗺️</span> <span data-i18n="chapters"></span></button>
          <button class="secondary" id="home-shop"><span aria-hidden="true">🛒</span> <span data-i18n="shop"></span></button>
          <button class="secondary" id="home-board"><span aria-hidden="true">🏆</span> <span data-i18n="leaderboard"></span></button>
          <button class="secondary" id="home-album"><span aria-hidden="true">📖</span> <span data-i18n="album"></span></button>
        </div>
        <button class="secondary daily-btn" id="home-daily"><span aria-hidden="true">📅</span> <span data-i18n="daily"></span> <small id="home-daily-best"></small></button>
      </div>
    </section>

    <!-- Chapter select -->
    <section class="screen overlay hidden" id="chapters" aria-labelledby="chapters-title">
      <div class="card wide">
        <header class="card-head">
          <h2 id="chapters-title" data-i18n="chapters"></h2>
          <button class="icon" data-close data-i18n-attr="aria-label:close;title:close">✕</button>
        </header>
        <div class="chapter-list" id="chapter-list"></div>
      </div>
    </section>

    <!-- Shop -->
    <section class="screen overlay hidden" id="shop" aria-labelledby="shop-title">
      <div class="card wide shop-card">
        <header class="card-head">
          <h2 id="shop-title" data-i18n="shop"></h2>
          <div class="coins-pill small"><span aria-hidden="true">⭐</span> <b id="shop-coins">0</b><span class="sr-only" data-i18n="coins"></span></div>
          <button class="icon" data-close data-i18n-attr="aria-label:close;title:close">✕</button>
        </header>
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-foods" aria-selected="true" data-i18n="shopFoods"></button>
          <button role="tab" id="tab-upgrades" aria-selected="false" data-i18n="shopUpgrades"></button>
          <button role="tab" id="tab-skins" aria-selected="false" data-i18n="shopSkins"></button>
        </div>
        <div class="shop-list" id="shop-list" role="tabpanel"></div>
      </div>
    </section>

    <!-- Chapter intro -->
    <section class="screen overlay hidden" id="intro" aria-labelledby="intro-title">
      <div class="card">
        <p class="kicker" id="intro-kicker"></p>
        <h2 id="intro-title"></h2>
        <ul class="goals" id="intro-goals"></ul>
        <p class="intro-stars" id="intro-stars"></p>
        <p class="tip" id="intro-prize"></p>
        <p class="muted" id="intro-best"></p>
        <p class="assist-note hidden" id="intro-assist-note" data-i18n="assistNote"></p>
        <div class="actions">
          <button class="primary big" id="intro-go" data-i18n="go"></button>
          <button class="secondary hidden" id="intro-assist"><span aria-hidden="true">🎯</span> <span data-i18n="assist"></span></button>
          <button class="secondary" id="intro-shop"><span aria-hidden="true">🛒</span> <span data-i18n="shop"></span></button>
          <button class="link-btn" id="intro-back" data-i18n="back"></button>
        </div>
      </div>
    </section>

    <!-- Playing -->
    <header class="hud hidden" id="hud">
      <div class="hud-time" id="hud-time" role="timer"><span class="hud-label" data-i18n="time"></span> <b id="time-text" dir="ltr">03:00</b></div>
      <div class="hud-ammo" id="hud-ammo" role="status"><span aria-hidden="true">🧺</span> <b id="ammo-text" dir="ltr"></b><span class="sr-only" data-i18n="ammoLeft"></span></div>
      <div class="hud-goals" id="hud-goals"></div>
      <div class="hud-score">
        <b id="score-text">0</b> <span class="hud-label" data-i18n="score"></span>
        <span class="meter" id="star-meter" role="img" data-i18n-attr="aria-label:starsMeter"><i id="star-fill"></i><b class="m2">★</b><b class="m3">★</b></span>
      </div>
      <button class="icon" id="pause-btn" data-i18n-attr="aria-label:pause;title:pause"><span class="pause-bars" aria-hidden="true"></span></button>
    </header>
    <!-- Under the HUD: one message at a time. The combo sits low, above the tray, so the top stays clear. -->
    <div class="top-stack" id="top-stack">
      <div class="coach hidden" id="coach" role="status"></div>
    </div>
    <div class="combo hidden" id="combo" aria-hidden="true"><b id="combo-text"></b><i id="combo-bar"></i></div>
    <div class="banner hidden" id="banner" aria-hidden="true"></div>
    <div class="aim-hint hidden" id="aim-hint"><span class="hand" aria-hidden="true">👆</span> <span data-i18n="aimHint"></span></div>
    <nav class="tray hidden" id="tray" data-i18n-attr="aria-label:tray"></nav>
    <div class="rotate hidden" id="rotate">
      <button class="icon" id="rot-ccw" data-i18n-attr="aria-label:rotateCcw;title:rotateCcw" dir="ltr">⟲</button>
      <button class="icon" id="rot-cw" data-i18n-attr="aria-label:rotateCw;title:rotateCw" dir="ltr">⟳</button>
    </div>

    <button class="icon skill umbrella hidden" id="umbrella" data-i18n-attr="aria-label:umbrella;title:umbrella"><span aria-hidden="true">🌂</span><i id="umbrella-ring" aria-hidden="true"></i></button>
 <button class="icon skill friend hidden" id="friend" data-i18n-attr="aria-label:friend;title:friend"><span aria-hidden="true">🐰</span><i id="friend-ring" aria-hidden="true"></i></button>
    <div class="goo" id="goo" aria-hidden="true"></div>

    <!-- Replay -->
    <div class="replay-bar hidden" id="replay-bar">
      <div><b data-i18n="slowMotion"></b> <span data-i18n="replayBest"></span></div>
      <button class="secondary" id="replay-skip" data-i18n="skip"></button>
    </div>

    <!-- Results -->
    <section class="screen overlay hidden" id="result" aria-labelledby="result-title">
      <div class="card result-card">
        <h2 class="result-title" id="result-title"></h2>
        <div class="stars" id="result-stars" aria-hidden="true"></div>
        <div class="result-main">
          <ul class="result-goals" id="result-goals" data-i18n-attr="aria-label:goalsTitle"></ul>
          <dl class="stats" id="result-stats"></dl>
        </div>
        <div class="result-side">
          <p class="star-note" id="result-star-note"></p>
          <p class="lead" id="result-note"></p>
          <div class="actions">
            <button class="primary big" id="result-next"></button>
            <button class="secondary hidden" id="result-again" data-i18n="improveStars"></button>
            <button class="secondary" id="result-shop"><span aria-hidden="true">🛒</span> <span data-i18n="shop"></span></button>
            <button class="link-btn" id="result-share"><span aria-hidden="true">📣</span> <span data-i18n="share"></span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- The mop -->
    <div class="mop-hint hidden" id="mop-hint">
      <b data-i18n="mopTitle"></b>
      <span><span data-i18n="mopHint"></span> <span class="swipe" aria-hidden="true">→</span></span>
    </div>
    <button class="secondary mop-skip hidden" id="mop-skip" data-i18n="skipMop"></button>

    <!-- A prize: a new food or slingshot colour -->
    <section class="screen reveal hidden" id="reveal" aria-labelledby="reveal-title" role="dialog" aria-modal="true">
      <div class="rays" aria-hidden="true"></div>
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="reveal-card">
        <p class="reveal-kicker" id="reveal-kicker"></p>
        <canvas id="reveal-canvas" aria-hidden="true"></canvas>
        <h2 id="reveal-title"></h2>
        <p class="lead" id="reveal-text"></p>
        <div class="bars hidden" id="reveal-bars"></div>
        <div class="actions">
          <button class="primary big" id="reveal-ok"></button>
          <button class="link-btn hidden" id="reveal-later" data-i18n="prizeLater"></button>
        </div>
      </div>
    </section>

    <!-- Leaderboards -->
    <section class="screen overlay hidden" id="board" aria-labelledby="board-title">
      <div class="card wide">
        <header class="card-head">
          <h2 id="board-title" data-i18n="boardTitle"></h2>
          <button class="icon" data-close data-i18n-attr="aria-label:close;title:close">✕</button>
        </header>
        <div class="tabs" role="tablist">
          <button role="tab" id="board-tab-daily" aria-selected="true" data-i18n="boardToday"></button>
          <button role="tab" id="board-tab-all" aria-selected="false" data-i18n="boardAll"></button>
        </div>
        <p class="board-me" id="board-me"></p>
        <ol class="board-list" id="board-list" role="tabpanel"></ol>
        <div class="actions">
          <button class="secondary" id="board-rename" data-i18n="changeNick"></button>
          <button class="link-btn" id="board-leave" data-i18n="leaveBoard"></button>
        </div>
      </div>
    </section>

    <section class="screen overlay hidden" id="join" aria-labelledby="join-title">
      <form class="card" id="join-form">
        <div class="card-art" aria-hidden="true">🏆</div>
        <h2 id="join-title" data-i18n="joinTitle"></h2>
        <p class="lead" data-i18n="joinLead"></p>
        <label class="field">
          <span class="field-label" data-i18n="nickLabel"></span>
          <span class="nick-row">
            <input id="join-name" maxlength="14" autocomplete="off" dir="auto" required />
            <button type="button" class="icon" id="join-dice" data-i18n-attr="aria-label:randomNick;title:randomNick">🎲</button>
          </span>
        </label>
        <div class="actions">
          <button type="submit" class="primary big" data-i18n="join"></button>
          <button type="button" class="link-btn" id="join-later" data-i18n="notNow"></button>
        </div>
      </form>
    </section>

    <!-- The bug album -->
    <section class="screen overlay hidden" id="album" aria-labelledby="album-title">
      <div class="card wide">
        <header class="card-head">
          <h2 id="album-title" data-i18n="albumTitle"></h2>
          <button class="icon" data-close data-i18n-attr="aria-label:close;title:close">✕</button>
        </header>
        <div class="album-list" id="album-list"></div>
      </div>
    </section>

    <!-- Phones held sideways: the game is made for portrait, so it asks to be turned back (shown by CSS only) -->
    <section class="turn-back" id="turn-back" role="alert" aria-labelledby="turn-title">
      <div class="turn-phone" aria-hidden="true">📱</div>
      <h2 id="turn-title" data-i18n="turnBackTitle"></h2>
      <p data-i18n="turnBackText"></p>
    </section>

    <!-- The phone could not draw the world twice in a row -->
    <section class="screen overlay hidden" id="gfx-lost" role="alert" aria-labelledby="gfx-lost-title">
      <div class="card">
        <h2 id="gfx-lost-title" data-i18n="gfxLostTitle"></h2>
        <p data-i18n="gfxLostText"></p>
        <div class="actions column">
          <button class="primary big" id="gfx-retry" data-i18n="gfxRetry"></button>
        </div>
      </div>
    </section>

    <!-- Pause -->
    <section class="screen overlay hidden" id="pause" aria-labelledby="pause-title">
      <div class="card">
        <h2 id="pause-title" data-i18n="paused"></h2>
        <div class="actions column">
          <button class="primary big" id="pause-resume" data-autofocus data-i18n="resume"></button>
          <button class="secondary" id="pause-restart" data-i18n="restart"></button>
          <button class="secondary" id="pause-quit" data-i18n="quit"></button>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <section class="screen overlay hidden" id="menu" aria-labelledby="menu-title">
      <div class="card menu-card">
        <header class="card-head">
          <h2 id="menu-title" data-i18n="menu"></h2>
          <button class="icon" data-close data-i18n-attr="aria-label:close;title:close">✕</button>
        </header>
        <label class="lang-pick"><span aria-hidden="true">🌐</span> <span data-i18n="language"></span> <select id="m-lang"></select></label>
        <div class="menu-grid">
          <button id="m-music" aria-pressed="true"><span aria-hidden="true">🎵</span> <span data-i18n="music"></span></button>
          <button id="m-sfx" aria-pressed="true"><span aria-hidden="true">🔊</span> <span data-i18n="sfx"></span></button>
          <button id="m-haptics" aria-pressed="true"><span aria-hidden="true">📳</span> <span data-i18n="haptics"></span></button>
          <button id="m-motion" aria-pressed="false"><span aria-hidden="true">🌙</span> <span data-i18n="lessMotion"></span></button>
          <button id="m-battery" aria-pressed="false"><span aria-hidden="true">🔋</span> <span data-i18n="batterySaver"></span></button>
          <button id="m-fullscreen"><span aria-hidden="true">⛶</span> <span id="m-fullscreen-label"></span></button>
          <button id="m-install"><span aria-hidden="true">⤓</span> <span data-i18n="install"></span></button>
        </div>
        <p class="menu-note" data-i18n="keyboardHelp"></p>
        <div class="menu-links">
          <button data-page="privacy"><span aria-hidden="true">🔒</span> <span data-i18n="privacy"></span></button>
          <button data-page="terms"><span aria-hidden="true">📜</span> <span data-i18n="terms"></span></button>
          <button id="m-reset"><span aria-hidden="true">↺</span> <span data-i18n="reset"></span></button>
        </div>
        <section class="dev hidden" id="dev" aria-labelledby="dev-title">
          <h3 id="dev-title" data-i18n="devTitle"></h3>
          <button id="dev-toggle" aria-pressed="false"><span aria-hidden="true">🛠</span> <span data-i18n="devMode"></span></button>
          <div class="dev-tools hidden" id="dev-tools">
            <button id="dev-copy"><span aria-hidden="true">📋</span> <span data-i18n="devCopy"></span></button>
            <button id="dev-download"><span aria-hidden="true">💾</span> <span data-i18n="devDownload"></span></button>
            <button id="dev-share" class="hidden"><span aria-hidden="true">📤</span> <span data-i18n="devShare"></span></button>
            <button id="dev-clear"><span aria-hidden="true">🧹</span> <span data-i18n="devClear"></span></button>
            <button id="dev-unlock"><span aria-hidden="true">🔓</span> <span data-i18n="devUnlock"></span></button>
            <button id="dev-lose"><span aria-hidden="true">💥</span> <span data-i18n="devLose"></span></button>
            <label class="dev-chapter"><span data-i18n="devChapter"></span> <select id="dev-chapter"></select></label>
            <button id="dev-go"><span aria-hidden="true">▶</span> <span data-i18n="devGo"></span></button>
          </div>
        </section>
        <button class="version" id="version-tap" type="button"><span data-i18n="version"></span> <span id="app-version" dir="ltr"></span></button>
      </div>
    </section>

    <section class="screen overlay hidden" id="page" aria-labelledby="page-title">
      <article class="card">
        <header class="card-head">
          <h2 id="page-title"></h2>
          <button class="icon" data-close data-i18n-attr="aria-label:close;title:close">✕</button>
        </header>
        <p class="page-body" id="page-body"></p>
      </article>
    </section>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
    <div class="update hidden" id="update" role="status">
      <span data-i18n="updateAvailable"></span>
      <button class="primary" id="update-now" data-i18n="updateNow"></button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
